name: Atualizar Biblioteca

permissions:
  contents: write

on:

  schedule:
    - cron: '0 12 * * 0'

  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Instalar dependências
        run: npm install

      - name: Mostrar arquivos do repositório
        run: |
          pwd
          ls -la
      
      - name: Verificar Secrets
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          echo "CLIENT_ID definido?"
          if [ -n "$TWITCH_CLIENT_ID" ]; then echo "SIM"; else echo "NAO"; fi
      
          echo "CLIENT_SECRET definido?"
          if [ -n "$TWITCH_CLIENT_SECRET" ]; then echo "SIM"; else echo "NAO"; fi
      
      - name: Executar geração
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node generate.js

      - name: Commit automático
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "Atualização automática da biblioteca"

          git push
